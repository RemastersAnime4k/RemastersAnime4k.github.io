<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remastersanime4k</title>
    <meta name="description" content="Remastersanime4k - Tu fuente principal de anime remasterizado en 4K, mangas y más">
    <meta name="theme-color" content="#ff6b6b">
    <meta property="og:title" content="Remastersanime4k">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- MEJORAS DE SEGURIDAD BASICA -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- MEJORA RENDIMIENTO: Precargar el JSON inmediatamente -->
    <link rel="preload" href="animeData.json" as="fetch" crossorigin="anonymous">

    <!-- PRECONEXIONES OPTIMIZADAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.pinimg.com">
    <link rel="dns-prefetch" href="https://i.pinimg.com">
    
    <!-- TIPOGRAFÍAS ASÍNCRONAS -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Inter:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Inter:wght@300;400;600&display=swap"></noscript>

    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --dark-bg: #000000; 
            --dark-card: #121212; 
            --text-light: #ffffff;
            --text-secondary: #cccccc;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glow-red: 0 0 15px rgba(255, 107, 107, 0.6);
        }
        
        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, #000000 , #1a0000, #0a0000);
            z-index: -1;
            will-change: transform;
            animation: gradientFlowGPU 20s ease-in-out infinite alternate;
        }

        .navbar {
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: var(--glass-bg);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 3px 3px 6px #00000045, -3px -3px 9px rgb(0 0 0 / 25%);
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .site-title {
            color: var(--text-light);
            font-size: 1.8rem;
            margin: 0;
            text-decoration: none;
            cursor: default;
            user-select: none;
        }

        .nav-links {
            display: flex;
            gap: 1.2rem;
            flex-grow: 1;
            justify-content: center;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .nav-links a.active {
            background: var(--primary-color);
            color: #000000 !important;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .nav-links a:hover {
            background: var(--primary-color);
            box-shadow: var(--glow-red);
        }

        .search-container {
            position: relative;
            max-width: 400px;
            width: 100%;
            flex-grow: 1;
            min-width: 200px;
        }

        .search-input {
            width: 90%;
            padding: 0.8rem 1.5rem;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            box-shadow: inset 1px 1px 3px var(--glass-bg), inset -1px -1px 3px var(--glass-bg);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.7); }

        .search-input:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
            box-shadow: inset 1px 1px 3px var(--primary-color), inset -1px -1px 3px var(--primary-color);
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
            margin-bottom: 80px;
        }

        .anime-card {
            background-color: rgba(24, 24, 24, 0.85); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 1rem;
            border: 2px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 450px;
            box-shadow: 0 4px 10px var(--glass-shadow);
            
            /* RENDIMIENTO 100%: Solo renderizar lo visible (Evita colapsar móviles con muchos animes) */
            content-visibility: auto;
            contain-intrinsic-size: auto 450px;

            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .anime-card.visible, .asd-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .anime-card.visible:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: var(--glow-red);
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .card-link::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .anime-image {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            border-radius: 15px;
            object-fit: cover;
            border: 3px solid white;
            transition: transform 0.3s ease;
            box-sizing: border-box;
            background-color: #1a1a1a;
        }

        .anime-card:hover .anime-image {
            transform: scale(1.02);
        }

        .category-bubbles {
            position: absolute;
            top: 13px;
            left: 10px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            max-width: 80%;
            z-index: 2;
        }

        /* ACCESIBILIDAD 100%: Cambio a color de alto contraste que respeta directiva WCAG AA */
        .category-bubble {
            background-color: #c82333; 
            padding: 0.1rem 0.8rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
            color: #ffffff;
            border: 1px solid #c82333;
        }

        .anime-title {
            text-align: center;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            height: 3.25em;
            margin: 0.5rem 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .anime-description {
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            border-radius: 5px 5px 15px 15px;
            border-top: 2px solid white;
            font-family: 'Inter', sans-serif;
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.4;
            height: 115px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
        }

        .favorite-icon {
            position: absolute;
            top: 0px;
            right: 10px;
            background: none;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 1.7rem;
            color: var(--primary-color);
            z-index: 3; 
            transition: all 0.3s ease;
            outline-offset: -2px;
        }

        .favorite-icon:hover { transform: scale(1.2); }
        .favorite-icon.active {
            color: #ff0000;
            transform: scale(1.3);
            animation: pulse 0.5s ease;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: var(--glow-red);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1000;
        }
        
        .back-to-top.show {
            opacity: 1;
            transform: translateY(0);
        }        

        .loading { display: none; text-align: center; font-size: 1.2rem; margin: 2rem 0; }
        .no-results { text-align: center; font-size: 1.5rem; width: 100%; margin-top: 2rem; }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0.5rem;
            width: 45px;
            height: 45px;
        }

        .asd-container {
            grid-column: 1 / -1;
            background: var(--glass-bg);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 2rem 0;
            position: relative;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 1px 1px 3px var(--glass-shadow);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            min-height: 180px;
        }
        
        .asd-container:not(.fallback-ad) { justify-content: center; }
        .asd-container.fallback-ad:hover { box-shadow: var(--glow-red); }

        .asd-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary-color);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.7rem;
            z-index: 2;
        }

        .asd-image {
            width: 250px;
            height: auto;
            aspect-ratio: 5 / 3;
            border-radius: 15px;
            object-fit: cover;
            border: 3px solid white;
            flex-shrink: 0;
        }

        .asd-content { flex-grow: 1; }
        .asd-title { font-size: 1.4rem; margin: 0 0 1rem 0; }
        .asd-description { font-family: 'Inter', sans-serif; font-size: 0.95rem; line-height: 1.4; margin-bottom: 1rem; }
        .asd-cta {
            display: inline-block;
            background: var(--primary-color);
            color: white !important;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            border: 2px solid white;
        }

        @media (max-width: 768px) {
            body { padding: 10px; padding-bottom: 50px; }
            .navbar {
                gap: 1rem; padding: 1rem; top: 10px;
                transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            .nav-hidden { transform: translateY(-150%) !important; }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #1a1a1a;
                margin-top: 10px;
                display: none;
                z-index: 1001;
                border: 2px solid rgba(255, 255, 255, 0.3);
                padding: 1.5rem;
                gap: 1rem;
            }
            .nav-links.active {
                display: flex; flex-direction: column;
                animation: slideDown 0.3s ease-out;
                border-radius: 12px;
            }
            @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
            .menu-toggle { order: 1; margin-left: auto; display: flex; align-items: center; justify-content: center; }
            .search-input { width: 100%; font-size: 1.1rem; padding: 0.9rem 1.3rem; }
            .search-container { order: 2; width: 100%; min-width: auto; }
            .anime-grid { grid-template-columns: 1fr; gap: 1.5rem; padding: 1rem; }
            
            .anime-card { 
                background-color: #1a1a1a;
                backdrop-filter: none; 
                -webkit-backdrop-filter: none;
            }
            .anime-card.visible:hover { transform: translateY(0); }
            .anime-card:active { transform: scale(0.98); }

            .asd-container { flex-direction: column; text-align: center; padding: 1rem; }
            .asd-image { width: 100%; height: auto; }
            .asd-badge { position: static; margin: 0 auto 1rem auto; width: fit-content; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .anime-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @keyframes gradientFlowGPU { 0% { transform: translate(0, 0); } 100% { transform: translate(5%, 5%); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1.3); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Navegación principal">
        <h1 class="site-title">Remastersanime4k</h1>
        <button class="menu-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="nav-links-container">☰</button>
        <div class="nav-links" id="nav-links-container">
            <a href="#home" class="active">Inicio</a>
            <a href="#anime">Anime</a>
            <a href="#manga">Mangas</a>
            <a href="#manhwa">Manhwa</a>
            <a href="#manhua">Manhua</a>
            <a href="#favorites">Favoritos</a>
        </div>
        <div class="search-container">
            <label for="searchInput" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;">Buscar anime</label>
            <input type="text" id="searchInput" class="search-input" 
                   placeholder="Buscar contenido..."
                   aria-label="Buscar contenido">
        </div>
    </nav>

    <main id="main-content">
        <div class="loading">🔄 Cargando...</div>
        <div class="anime-grid"></div>
    </main>

    <button class="back-to-top" aria-label="Volver al inicio">↑</button>

<script>
    let currentCategory = 'home';
    let searchTerm = '';
    window.animeData =[]; 
    let adsterraContainerCreated = false; 

    function createFallbackAd() {
        const adSlots = document.querySelectorAll('.asd-container');
        if (adSlots.length === 0) return;

        const fallbackAdContent = `
            <a href="https://remastersanime4k.github.io/Espacio-Publicitario.html" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit; display: contents;">
                <div class="asd-badge">PUBLICIDAD</div>
                <img src="https://i.pinimg.com/236x/11/15/2d/11152dc45f236704097ab8582b865acb.jpg" 
                    class="asd-image" width="250" height="150"
                    alt="Publicidad"
                    loading="lazy" decoding="async">
                <div class="asd-content">
                    <h2 class="asd-title">¡Tu apoyo hace la diferencia! ❤️</h2>
                    <p class="asd-description">Tu visita a los patrocinadores hace posible que sigamos compartiendo tu anime favorito en 4K</p>
                    <div class="asd-cta">Visitar</div>
                </div>
            </a>
        `;
        
        adSlots.forEach(container => {
            if (container.innerHTML.trim() === '' || container.querySelector('#container-92a5cd60c487a8ec687237fdb53b8531')) {
                 container.classList.add('fallback-ad'); 
                 container.innerHTML = fallbackAdContent;
            }
        });
    }

    function createAdElement(isFirstAd) {
        const adContainer = document.createElement('div');
        adContainer.className = 'asd-container';
        if (isFirstAd) {
            const badge = document.createElement('div');
            badge.className = 'asd-badge';
            badge.textContent = 'PUBLICIDAD';
            adContainer.appendChild(badge);
            const adsterraPlaceholder = document.createElement('div');
            adsterraPlaceholder.id = 'container-92a5cd60c487a8ec687237fdb53b8531';
            adContainer.appendChild(adsterraPlaceholder);
        }
        return adContainer;
    }

    async function loadAnimeData() {
        try {
            const response = await fetch('animeData.json');
            if (!response.ok) { throw new Error(`Error HTTP: ${response.status}`); }
            return await response.json();
        } catch (error) {
            document.querySelector('.anime-grid').innerHTML = `<p class="no-results" style="grid-column: 1 / -1;">Error al cargar los datos. Por favor, inténtalo más tarde.</p>`;
            return[];
        }
    }

    function toggleFavorite(title) {
        const favorites = JSON.parse(localStorage.getItem('favorites')) ||[];
        const index = favorites.indexOf(title);
        if (index === -1) { favorites.push(title); } else { favorites.splice(index, 1); }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavoriteIcons();
        if (currentCategory === 'favorites') { filterCards(); }
    }

    function updateFavoriteIcons() {
        const favorites = JSON.parse(localStorage.getItem('favorites')) ||[];
        document.querySelectorAll('.favorite-icon').forEach(icon => {
            const titleElement = icon.closest('.anime-card').querySelector('.card-link');
            if (titleElement) {
                const title = titleElement.textContent;
                icon.classList.toggle('active', favorites.includes(title));
                icon.setAttribute('aria-pressed', favorites.includes(title).toString());
            }
        });
    }

    function generateCards(data) {
        const grid = document.querySelector('.anime-grid');
        grid.innerHTML = ''; 
        const fragment = document.createDocumentFragment();
        adsterraContainerCreated = false; 

        if (!Array.isArray(data)) {
            updateNoResultsMessage([]);
            return;
        }

        data.forEach((item, index) => {
            if (index > 0 && index % 18 === 0) {
                const adElement = createAdElement(!adsterraContainerCreated);
                if (!adsterraContainerCreated) { adsterraContainerCreated = true; }
                fragment.appendChild(adElement);
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = 'anime-card';
            
            const sanitizedTitle = item.title.replace(/'/g, "\\'").replace(/"/g, "&quot;");

            const isImagePriority = index < 2; 
            const imgLoadingAttr = isImagePriority 
                ? 'loading="eager" fetchpriority="high" decoding="sync"' 
                : 'loading="lazy" decoding="async"';
            
            const isVisiblePriority = index < 6;
            if (isVisiblePriority) { cardDiv.classList.add('visible'); }

            cardDiv.innerHTML = `
                <button class="favorite-icon" onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite('${sanitizedTitle}')" aria-pressed="false" aria-label="Marcar como favorito">♥</button>
                <div class="category-bubbles">
                    ${(item.categories ||[]).map(cat => `<div class="category-bubble">${cat.toUpperCase()}</div>`).join('')}
                </div>
                <img src="${item.image}"
                     alt="Portada de ${sanitizedTitle}"
                     class="anime-image" width="236" height="354"
                     ${imgLoadingAttr}
                     onerror="this.src='https://via.placeholder.com/236x354?text=Imagen+no+disponible'">
                <h2 class="anime-title">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card-link" aria-label="Ver ${sanitizedTitle}">${item.title}</a>
                </h2>
                <div class="anime-description">
                    <p class="description-content">${item.description}</p>
                </div>`;
            fragment.appendChild(cardDiv);
        });
        grid.appendChild(fragment);
    }

    function filterCards() {
        if (!window.animeData || window.animeData.length === 0) {
            updateNoResultsMessage([]);
            return;
        }

        let filteredData;
        if (currentCategory === 'favorites') {
            const favorites = JSON.parse(localStorage.getItem('favorites')) ||[];
            filteredData = window.animeData.filter(item => favorites.includes(item.title) && item.title.toLowerCase().includes(searchTerm.toLowerCase()));
        } else {
            filteredData = window.animeData.filter(item => (currentCategory === 'home' || (item.categories && item.categories.includes(currentCategory))) && item.title.toLowerCase().includes(searchTerm.toLowerCase()));
        }

        // RENDIMIENTO 100%: Eliminado el "Reprocesamiento Forzado" en la manipulación del DOM al quitar las transiciones inútiles del display 'loading'
        generateCards(filteredData);
        updateNoResultsMessage(filteredData);
        updateFavoriteIcons();
        setupIntersectionObserver();
    }

    function updateNoResultsMessage(data) {
        let existingMessage = document.querySelector('.no-results');
        const grid = document.querySelector('.anime-grid');

        if (data.length === 0) {
            if (!existingMessage) {
                existingMessage = document.createElement('p');
                existingMessage.className = 'no-results';
                existingMessage.style.gridColumn = '1 / -1'; 
                grid.insertAdjacentElement('afterend', existingMessage);
            }
            if (currentCategory === 'favorites') {
                if (searchTerm) { existingMessage.textContent = `💔 No se encontraron favoritos que coincidan con "${searchTerm}".`; } 
                else { existingMessage.textContent = '💔 Aún no has añadido nada a favoritos. ¡Toca el corazón en tus animes preferidos para guardarlos aquí!'; }
            } else {
                existingMessage.textContent = `🔍 No se encontraron resultados para "${searchTerm || 'la categoría seleccionada'}"`;
            }
        } else if (existingMessage) {
            existingMessage.remove();
        }
    }

    function setupIntersectionObserver() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { rootMargin: '0px 0px 50px 0px', threshold: 0.1 }); 

        document.querySelectorAll('.anime-card:not(.visible), .asd-container:not(.visible)').forEach(card => {
            observer.observe(card);
        });
    }

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const newCategory = link.getAttribute('href').slice(1);
            if (currentCategory === newCategory && searchTerm === '') return; 

            currentCategory = newCategory;
            localStorage.setItem('selectedCategory', currentCategory); 

            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            link.classList.add('active');
            
            const navLinksContainer = document.querySelector('.nav-links');
            if (navLinksContainer.classList.contains('active')) {
                 navLinksContainer.classList.remove('active');
                 document.querySelector('.menu-toggle').textContent = '☰';
                 document.querySelector('.menu-toggle').setAttribute('aria-expanded', 'false');
            }
            filterCards();
        });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value.trim();
        filterCards();
    });

    document.querySelector('.menu-toggle').addEventListener('click', (e) => {
        e.stopPropagation(); 
        const navLinks = document.querySelector('.nav-links');
        const isOpening = !navLinks.classList.contains('active');
        navLinks.classList.toggle('active');
        e.currentTarget.textContent = isOpening ? '×' : '☰';
        e.currentTarget.setAttribute('aria-expanded', isOpening.toString());
        document.querySelector('.navbar').classList.toggle('active', isOpening);
    });

    document.addEventListener('click', (e) => {
        const navLinks = document.querySelector('.nav-links');
        const menuToggle = document.querySelector('.menu-toggle');
        if (navLinks.classList.contains('active') && !e.target.closest('.navbar')) {
            navLinks.classList.remove('active');
            menuToggle.textContent = '☰';
            menuToggle.setAttribute('aria-expanded', 'false');
            document.querySelector('.navbar').classList.remove('active');
        }
    });

    let scrollTimeout;
    window.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const button = document.querySelector('.back-to-top');
            if (window.scrollY > 300) { button.classList.add('show'); } 
            else { button.classList.remove('show'); }

            const navLinks = document.querySelector('.nav-links');
            if (navLinks.classList.contains('active')) {
                navLinks.classList.remove('active');
                document.querySelector('.menu-toggle').textContent = '☰';
                document.querySelector('.menu-toggle').setAttribute('aria-expanded', 'false');
                document.querySelector('.navbar').classList.remove('active');
            }
        }, 50); 
    }, { passive: true });

    document.querySelector('.back-to-top').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    class MobileNavigation {
        constructor() {
            this.lastScroll = 0;
            this.navbar = document.querySelector('.navbar');
            this.isMobile = window.innerWidth <= 768;
            this.throttleTimeout = null;
            this.navHidden = false;
            this.addEventListeners();
            this.handleResize(); 
        }

        addEventListeners() {
            window.addEventListener('scroll', () => this.handleScrollThrottled(), { passive: true });
            window.addEventListener('resize', () => this.handleResize());
        }
        
        handleScrollThrottled() {
            if (!this.throttleTimeout) {
                this.throttleTimeout = setTimeout(() => {
                    this.performScrollAction();
                    this.throttleTimeout = null;
                }, 100); 
            }
        }

        performScrollAction() {
            if (!this.isMobile || document.querySelector('.nav-links.active')) return; 

            const currentScroll = window.scrollY;
            if (currentScroll > this.lastScroll && currentScroll > 150) { 
                if (!this.navHidden) {
                    this.navbar.classList.add('nav-hidden');
                    this.navHidden = true;
                }
            } else {
                if (this.navHidden) {
                    this.navbar.classList.remove('nav-hidden');
                    this.navHidden = false;
                }
            }
            this.lastScroll = currentScroll <= 0 ? 0 : currentScroll; 
        }

        handleResize() {
            this.isMobile = window.innerWidth <= 768;
            if (!this.isMobile) {
                this.navbar.classList.remove('nav-hidden');
                this.navHidden = false; 
                const navLinks = document.querySelector('.nav-links');
                if(navLinks.classList.contains('active')){
                    navLinks.classList.remove('active');
                    document.querySelector('.menu-toggle').textContent = '☰';
                    document.querySelector('.menu-toggle').setAttribute('aria-expanded', 'false');
                    document.querySelector('.navbar').classList.remove('active');
                }
            }
            this.performScrollAction();
        }
    }

    let adsterraScriptAdded = false;
    function triggerAdsterraScriptLoad() {
        if (adsterraScriptAdded) return;
        adsterraScriptAdded = true;
        
        try {
            const nativeScript = document.createElement('script');
            nativeScript.async = true;
            nativeScript.dataset.cfasync = 'false';
            nativeScript.src = '//pl27363244.profitableratecpm.com/92a5cd60c487a8ec687237fdb53b8531/invoke.js';
            nativeScript.onerror = function() { console.warn('Adblocker detectado'); createFallbackAd(); };
            document.head.appendChild(nativeScript);
        } catch(e){}
        
        setTimeout(() => {
            const adContainer = document.getElementById('container-92a5cd60c487a8ec687237fdb53b8531');
            if (adContainer && adContainer.innerHTML.trim() === '') {
                createFallbackAd();
            }
        }, 5000);
        
        ['scroll', 'mousemove', 'touchstart', 'click'].forEach(evt => {
            window.removeEventListener(evt, triggerAdsterraScriptLoad);
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const loadingDiv = document.querySelector('.loading');
        loadingDiv.style.display = 'block'; 
        
        new MobileNavigation();

        currentCategory = localStorage.getItem('selectedCategory') || 'home';
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-links a[href="#${currentCategory}"]`);
        if (activeLink) {
            activeLink.classList.add('active');
        } else { 
            document.querySelector('.nav-links a[href="#home"]').classList.add('active');
            currentCategory = 'home';
        }
        
        window.animeData = await loadAnimeData();
        
        // Ocultamos permanentemente el loading, librándonos del reprocesamiento forzado al buscar.
        loadingDiv.style.display = 'none'; 
        
        filterCards(); 

        updateFavoriteIcons(); 

        ['scroll', 'mousemove', 'touchstart', 'click'].forEach(evt => {
            window.addEventListener(evt, triggerAdsterraScriptLoad, { once: true, passive: true });
        });
        setTimeout(triggerAdsterraScriptLoad, 4000); 
    });
</script>
</body>
</html>
